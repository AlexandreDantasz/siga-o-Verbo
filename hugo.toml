baseURL = "https://alexandredantasz.github.io/siga-o-Verbo/"
languageCode = "pt-br"
title = "Siga o Verbo"
paginate = 10

[outputs]
  home = ["HTML", "JSON", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

# Taxonomias e URLs limpas
[taxonomies]
  tag = "tags"
  category = "categorias"

[params]
  author = "Alexandre Dantas"
  description = "Jovem de 22 anos que compartilha seu dia a dia na perspectiva de seu viver com Deus."
  subtitle = "Meditações e vida em Deus através da Palavra viva."
  footerText = "Siga o Verbo © 2026. Feito com simplicidade e reverência."
  # Tema padrão de visualização: "light", "paper" ou "dark"
  defaultTheme = "light"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = false
