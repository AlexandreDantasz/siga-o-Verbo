{{ define "main" }}
<div class="error-page">
  <div class="error-code">404</div>
  <h1 class="error-title">Página não encontrada</h1>
  <p style="color: var(--text-secondary); max-width: 480px; margin: 0 auto;">
    O caminho que você buscou não existe ou pode ter sido movido.
  </p>
  <blockquote class="error-verse">
    "Entrega o teu caminho ao Senhor; confia nele, e ele o fará."<br>
    <small>— Salmos 37:5</small>
  </blockquote>
  <a href="{{ "/" | relURL }}" class="btn-primary">
    Voltar para a página inicial
  </a>
</div>
{{ end }}
