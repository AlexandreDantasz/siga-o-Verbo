<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "pt-br" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.subtitle }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  
  <!-- OpenGraph / Metatags para compartilhamento elegante -->
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  
  <!-- Script de tema executado imediatamente para evitar flash de estilo -->
  <script src="{{ "js/theme.js" | relURL }}"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="{{ "/" | relURL }}" class="brand-link" aria-label="Siga o Verbo - Início">
        <!-- Ícone minimalista de Livro/Verbo Aberto -->
        <svg class="brand-icon" viewBox="0 0 24 24">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>{{ .Site.Title }}</span>
      </a>

      <nav class="nav-group" aria-label="Navegação principal">
        <a href="{{ "/" | relURL }}" class="nav-link {{ if .IsHome }}active{{ end }}">Início</a>
        <a href="{{ "posts/" | relURL }}" class="nav-link {{ if eq .Section "posts" }}active{{ end }}">Artigos</a>
        <a href="{{ "sobre/" | relURL }}" class="nav-link {{ if eq .RelPermalink "/sobre/" }}active{{ end }}">Sobre</a>
        
        <!-- Botão de Alternar Modo de Visualização (Lei de Fitts: min 44x44px) -->
        <button id="theme-toggle-btn" class="theme-switch-btn" type="button" aria-label="Alternar modo de leitura">
          <!-- Ícone Sol (Modo Claro) -->
          <svg class="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Ícone Livro (Modo Papel/Leitura) -->
          <svg class="icon-book" style="display: none;" viewBox="0 0 24 24">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <!-- Ícone Lua (Modo Escuro) -->
          <svg class="icon-moon" style="display: none;" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="main-wrapper">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>{{ .Site.Params.footerText }}</p>
      <p style="font-size: 0.8rem; opacity: 0.8;">"Lâmpada para os meus pés é a tua palavra e luz, para o meu caminho." — Salmos 119:105</p>
    </div>
  </footer>
</body>
</html>
