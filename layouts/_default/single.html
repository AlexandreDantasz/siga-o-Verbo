{{ define "main" }}
<article>
  <div class="back-nav">
    <a href="{{ "posts/" | relURL }}" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Todos os artigos
    </a>
  </div>

  <header class="article-header">
    <h1 class="article-title">{{ .Title }}</h1>
    
    <div class="article-meta">
      {{ with .Params.author }}
      <span class="author-tag">{{ . }}</span>
      <span class="dot">•</span>
      {{ end }}
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 de January de 2006" }}</time>
      <span class="dot">•</span>
      <span>{{ .ReadingTime }} min de leitura</span>
    </div>

    {{ with .Params.image }}
    <figure class="article-cover">
      <img src="{{ . | relURL }}" alt="{{ $.Params.imageAlt | default $.Title }}">
      {{ with $.Params.imageCaption }}
      <figcaption>{{ . }}</figcaption>
      {{ end }}
    </figure>
    {{ end }}
  </header>

  <div class="article-content">
    {{ .Content }}
  </div>

  <footer class="article-footer">
    <a href="{{ "posts/" | relURL }}" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar para artigos
    </a>
    
    <a href="{{ "/" | relURL }}" class="back-link">
      Início
    </a>
  </footer>
</article>
{{ end }}
